name: CI Pipeline

on:
  push:
    branches: [ "main", "backend", "frontend" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend   # <--- Point to your backend subfolder
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r rag-for-fun/backend/requirements.txt

  frontend-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: . # Change this if your frontend code is in a subfolder like 'frontend/'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build